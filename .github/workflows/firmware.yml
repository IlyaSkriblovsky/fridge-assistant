name: firmware

# Builds the production firmware only. Experiment rigs are built locally when
# needed. Host tests run separately; nothing is flashed.

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - .github/workflows/firmware.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - name: Install PlatformIO
        run: pipx install platformio==6.2.0
      - name: Run host unit tests
        run: pio test -e native

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7

      # The toolchain and framework come to about 5 GB unpacked, half the
      # repository's cache quota, so they are downloaded fresh every run.
      - name: Install PlatformIO
        run: pipx install platformio==6.2.0

      # Empty credentials build fine; they only fail at runtime, on the device.
      - name: Stand in for the gitignored secrets.h
        run: cp src/secrets.example.h src/secrets.h

      - name: Install the platform and libraries
        run: pio pkg install -e reterminal_e1005

      # Seeed_GFX2 names four headers *_EPaper_* and includes all four as
      # *_ePaper_*. macOS finds them anyway; Linux does not. Upstream main is the
      # same, so each gets a link under the name it is included by, made here
      # every run and never over a file that already has that name.
      - name: Work around the case of Seeed_GFX2's includes
        run: |
          find .pio/libdeps/*/Seeed_GFX2/src -name '*_EPaper_*' | while read -r file; do
            name=$(basename "$file")
            link="$(dirname "$file")/${name/_EPaper_/_ePaper_}"
            [ -e "$link" ] || ln -s "$name" "$link"
          done

      - name: Build production firmware
        run: pio run -e reterminal_e1005
