name: firmware

# Builds every PlatformIO environment: the firmware and each experiment rig. A
# rig that no longer builds cannot be re-run when its experiment has to be, and
# exp_e1_firmware wraps main.cpp's functions by mangled name, so a rename there
# fails its link. Host tests run separately; nothing is flashed.

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - .github/workflows/firmware.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - name: Install PlatformIO
        run: pipx install platformio==6.2.0
      - name: Run host unit tests
        run: pio test -e native

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7

      # The toolchain and framework come to about 5 GB unpacked, half the
      # repository's cache quota, so they are downloaded fresh every run.
      - name: Install PlatformIO
        run: pipx install platformio==6.2.0

      # Empty credentials build fine; they only fail at runtime, on the device.
      - name: Stand in for the gitignored secrets.h
        run: cp src/secrets.example.h src/secrets.h

      # default_envs names only the firmware; this overrides it with every
      # embedded environment, so a new rig is built too. Native runs above.
      - name: List embedded environments
        run: |
          {
            echo 'PLATFORMIO_DEFAULT_ENVS<<EOF'
            grep -oP '^\[env:\K[^]]+' platformio.ini | grep -v '^native$'
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Install the platform and libraries
        run: pio pkg install

      # Seeed_GFX2 names four headers *_EPaper_* and includes all four as
      # *_ePaper_*. macOS finds them anyway; Linux does not. Upstream main is the
      # same, so each gets a link under the name it is included by, made here
      # every run and never over a file that already has that name.
      - name: Work around the case of Seeed_GFX2's includes
        run: |
          find .pio/libdeps/*/Seeed_GFX2/src -name '*_EPaper_*' | while read -r file; do
            name=$(basename "$file")
            link="$(dirname "$file")/${name/_EPaper_/_ePaper_}"
            [ -e "$link" ] || ln -s "$name" "$link"
          done

      - name: Build every environment
        run: pio run
