name: formatting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          python-version: "3.12"
      - name: Check formatting
        run: uvx pre-commit==4.5.1 run --all-files --show-diff-on-failure
