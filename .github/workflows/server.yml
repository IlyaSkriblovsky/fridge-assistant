name: server

# Tests the backend, builds its image, checks that it starts, and on main
# pushes it to GHCR as :latest and :sha-<commit>. See server/docs/server.md.

on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/server.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ilyaskriblovsky/fridge-assistant-server

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run --locked pytest

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: server
          load: true
          tags: server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The fault endpoint answers without Gemini or Keep, so placeholder
      # settings are enough to see the image start, listen, check the token and
      # answer.
      - name: Smoke test
        run: |
          docker run -d --name server -p 8000:8000 \
            -e GEMINI_API_KEY=ci -e KEEP_EMAIL=ci -e KEEP_MASTER_TOKEN=ci -e KEEP_NOTE_ID=ci \
            -e DEVICE_TOKEN=ci \
            server:ci
          url=http://localhost:8000/audio/fault/empty
          reply=$(curl -fsS --retry 30 --retry-all-errors --retry-delay 1 \
            -X POST --data-binary x -H "Authorization: Bearer ci" $url) || true
          refused=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --data-binary x $url) || true
          docker logs server
          test "$reply" = "{}"
          test "$refused" = 401
          curl -fsS -H "Authorization: Bearer ci" \
            http://localhost:8000/sticky/dashboard -o /tmp/dashboard.mono1
          curl -fsS -H "Authorization: Bearer ci" \
            'http://localhost:8000/sticky/dashboard?format=png' -o /tmp/dashboard.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          assert len(Path('/tmp/dashboard.mono1').read_bytes()) == 48000
          png = Path('/tmp/dashboard.png').read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>IIBB', png[16:26]) == (800, 480, 1, 0)
          PY

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again, all of it from the cache the first one left.
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
