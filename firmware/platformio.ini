; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = reterminal_e1005

[env:reterminal_e1005]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-esp32-s3-sense
framework = arduino

upload_speed = 115200
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.flash_size = 32MB
board_build.partitions = reterminal_ota.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 3145728
lib_ldf_mode = deep

build_flags =
    -D BOARD_HAS_PSRAM
    -D MINIZ_ENABLE_ARCHIVE_APIS
    -D RETERMINAL_MODEL=1005
    -I src

lib_deps =
    ; Seeed_GFX2: successor of Seeed_GFX. Has an official reTerminal Sticky
    ; profile that auto-detects the SSD1677/SSD2677 panel controller.
    https://github.com/Seeed-Studio/Seeed_GFX2.git#84c5e34befcad2559bc2979c66a3309f1f8da817
