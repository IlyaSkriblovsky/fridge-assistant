; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = reterminal_e1005

[env:reterminal_e1005]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#1ec1287f8e4bc4067a6fd593991e36875aef989f
board = seeed-xiao-esp32-s3-sense
framework = arduino

upload_speed = 115200
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.flash_size = 32MB
board_build.partitions = reterminal_ota.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 3145728
lib_ldf_mode = deep

; src/experiments/ holds measurement rigs, one per file, each with its own
; setup()/loop(). They are never part of the firmware -- see docs/experiments.md.
build_src_filter = +<*> -<experiments/>

build_flags =
    -D BOARD_HAS_PSRAM
    -D MINIZ_ENABLE_ARCHIVE_APIS
    -D RETERMINAL_MODEL=1005
    -I src

lib_deps =
    ; Seeed_GFX2: successor of Seeed_GFX. Has an official reTerminal Sticky
    ; profile that auto-detects the SSD1677/SSD2677 panel controller.
    https://github.com/Seeed-Studio/Seeed_GFX2.git#84c5e34befcad2559bc2979c66a3309f1f8da817

    ; Backend answers are JSON. Hand-rolled extraction of the "response" field
    ; breaks on escape sequences, so use a real parser.
    bblanchon/ArduinoJson@^7.0.0

; E1 (wake-to-first-sample latency) and E3 (microphone settle window). Replaces
; main.cpp with the rig; everything else in src/ is the same code the firmware
; builds. Kept as an environment rather than a reverted commit because the boot
; half of E1 scales with the image, so it has to be re-run as the firmware grows.
[env:exp_e1]
extends = env:reterminal_e1005
build_src_filter = +<*> -<main.cpp> -<experiments/> +<experiments/e1_wake_latency.cpp>
monitor_rts = 0
monitor_dtr = 0

; E1 again, on the finished firmware -- S9. The only rig that keeps main.cpp:
; the boot is the image, and main.cpp is part of the image. What it adds is a
; timestamp around five of main.cpp's calls and a timer on its sleep, put there
; by the linker rather than by editing the firmware. The names are mangled
; because the linker knows no others; src/experiments/e1_firmware_wake.cpp has
; the table, and every wrapper calls its __real_, so a rename fails the link.
[env:exp_e1_firmware]
extends = env:reterminal_e1005
build_src_filter = +<*> -<experiments/> +<experiments/e1_firmware_wake.cpp>
build_flags =
    ${env:reterminal_e1005.build_flags}
    -Wl,--wrap=_Z5setupv
    -Wl,--wrap=_ZN11stickyPower9holdLatchEv
    -Wl,--wrap=_ZN9StickyMic5beginEmm
    -Wl,--wrap=_ZN12stickyBuzzer5readyEv
    -Wl,--wrap=_ZN11stickyPower9deepSleepEy
monitor_rts = 0
monitor_dtr = 0

; E6 (what the DHCP exchange is made of, and what a cached lease removes).
; Same association code as the firmware -- it builds src/wifi_link.cpp -- with
; main.cpp swapped for the rig. See docs/experiments.md.
[env:exp_e6]
extends = env:reterminal_e1005
build_src_filter = +<*> -<main.cpp> -<experiments/> +<experiments/e6_dhcp_cost.cpp>
monitor_rts = 0
monitor_dtr = 0

; E7 (what the upload costs, and where the extra seconds in it come from).
; Builds the firmware's own WifiLink, Recording and Backend -- upload 4
; of every wake goes through the last of them -- with main.cpp swapped for the
; rig. See docs/experiments.md.
[env:exp_e7]
extends = env:reterminal_e1005
build_src_filter = +<*> -<main.cpp> -<experiments/> +<experiments/e7_upload_cost.cpp>
monitor_rts = 0
monitor_dtr = 0

; E8 (what the 2.4 s of a refresh is made of). The only rig that does not build
; the firmware's own module for what it measures: StickyScreen names the driver
; through Config_Sticky_SSD1677_Fixed, and the whole point here is to put a
; different driver -- the same one with timestamps -- under the same panel. It
; draws the three screens' geometry itself instead. See docs/experiments.md.
[env:exp_e8]
extends = env:reterminal_e1005
build_src_filter = +<*> -<main.cpp> -<experiments/> +<experiments/e8_refresh_phases.cpp>
monitor_rts = 0
monitor_dtr = 0
